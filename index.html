<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tap-page — страница для вашего дела</title>
<meta name="description" content="Красивая страница в шапку профиля для мастеров и малого бизнеса. Без подписки.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Urbanist,system-ui,sans-serif;color:#2B2320;
  background:radial-gradient(90% 60% at 80% 0%,#F1E3D4,transparent 60%),#FBF7F2}
main{max-width:520px;text-align:center}
.mark{font-size:13px;letter-spacing:.3em;color:#8E6A48;font-weight:600}
h1{font-weight:500;font-size:clamp(34px,7vw,52px);line-height:1.08;margin:16px 0}
p{color:#6E615A;font-size:17px;line-height:1.5}
a.card{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:28px;padding:16px 20px;border-radius:20px;
  background:#fff;border:1px solid #E7DACB;color:inherit;text-decoration:none;font-weight:600;text-align:left}
a.card small{display:block;font-weight:500;color:#6E615A}
a.card:hover{border-color:#D9C2A9}
footer{margin-top:28px;font-size:13px;color:#6E615A}
</style>
</head>
<body>
<main>
  <div class="mark">TAP-PAGE</div>
  <h1>Страница для вашего дела — в шапку профиля</h1>
  <p>Услуги, цены, работы и запись в одном экране. Без конструктора и ежемесячной подписки.</p>
  <a class="card" href="/anastasia.gurieva"><span>Анастасия Гурьева<small>натуральный перманент, Красноярск</small></span><span>→</span></a>
  <footer>Хотите такую же? Напишите в Instagram @makswo</footer>
</main>
</body>
</html>
