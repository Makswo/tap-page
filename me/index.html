<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Профиль — tap-page</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08090a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/ui.css">
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
.top{padding-block:44px 0}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.logincard{margin-top:24px;border-radius:24px;padding:24px;background:var(--s1);border:1px solid var(--line2)}
.empty{color:var(--tx2);margin:0}
.bl{display:grid;gap:10px}.bi{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:16px;border-radius:20px;background:var(--s1);border:1px solid var(--line)}.bi.got{border-color:rgba(212,255,63,.35)}.bi small{display:block;font-family:var(--m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}.bi b{display:block;font-size:16px;margin:2px 0}.bi span{display:block;font-size:13.5px;color:var(--tx2)}.bi .cry{display:inline-flex;margin-top:5px;font-size:11.5px}.bi .cry i{width:6px;height:6px}.bi em{font-style:normal;font-size:12.5px;color:var(--tx3);white-space:nowrap}
.cbtns{display:flex;gap:8px;flex-wrap:wrap}
.bgem{width:56px;display:grid;place-items:center;align-self:center}.bgem .gem{margin:0}
@media (max-width:560px){.bi{grid-template-columns:auto 1fr;column-gap:12px}.bgem{grid-row:span 2;width:50px}.bi .btn,.bi em{grid-column:2;justify-self:start}}
.waits{display:flex;gap:8px;flex-wrap:wrap}
.loading{color:var(--tx3);padding:40px 0}
.fper{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.ftab{overflow-x:auto;border-radius:18px;border:1px solid var(--line);background:var(--s1)}
.ftab table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
.ftab th,.ftab td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.ftab th:first-child,.ftab td:first-child{text-align:left}
.ftab th{font-family:var(--m);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);font-weight:500}
.ftab td i{font-style:normal;color:var(--tx3);font-size:12px}
.ftab tr.tot td{font-weight:700;border-bottom:0}
.ftab .nos{color:var(--tx3)}
.adm{border-radius:22px;padding:18px;background:var(--s1);border:1px solid var(--line);margin-top:12px}
.adm-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.adm-h b{font-size:18px}
.adm-h span{font-family:var(--m);font-size:12.5px;color:var(--tx2)}
.adm label{display:block;font-family:var(--m);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin:14px 0 6px}
.adm input,.adm textarea{width:100%;border-radius:14px;background:var(--bg);border:1px solid var(--line2);padding:11px 14px;font:15px/1.45 var(--f);color:var(--tx);outline:none}
.adm input:focus,.adm textarea:focus{border-color:var(--acc)}
.adm textarea{min-height:150px;resize:vertical}
.adm .row2{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.adm .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.adm .st{font-size:14px;color:var(--tx2)}
.adm .st.ok{color:var(--ok)}.adm .st.bad{color:var(--bad)}
.adm details{margin-top:10px;font-size:14px;color:var(--tx2)}
.adm details ul{margin:8px 0 0;padding-left:18px;max-height:220px;overflow:auto;font-family:var(--m);font-size:12.5px}
.adm .warn{margin-top:12px;border:1px solid rgba(255,181,74,.4);border-radius:14px;padding:10px 14px;font-size:14px;color:var(--warn)}
.hist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px;font-size:13.5px;color:var(--tx2)}
.hist li{display:flex;gap:10px;flex-wrap:wrap}.hist b{color:var(--tx);font-weight:600}
@media (max-width:640px){.adm .row2{grid-template-columns:1fr}.adm .btns .btn{flex:1}}
</style>
</head>
<body>
<nav class="nav"><div class="wrap wide">
  <a class="logo" href="/"><i>M</i>makswo</a>
  <span class="sp"></span>
  <a class="mono" href="/#courses" style="text-decoration:none">Курсы</a>
</div></nav>

<main class="wrap wide" id="app"><p class="loading">Загружаем профиль…</p></main>

<footer>Сделал Макс · <a href="https://www.instagram.com/makswo/" target="_blank" rel="noopener">@makswo</a> · <a href="/oferta" target="_blank" rel="noopener">Публичная оферта</a> · <a href="/privacy" target="_blank" rel="noopener">Персональные данные</a><br><span class="freq">ИП Малыгин Максим Валерьевич · ИНН 183512338627 · ОГРНИП 323180000018526 · <a href="mailto:mxmginarm@gmail.com">mxmginarm@gmail.com</a></span></footer>

<script src="/assets/gem.js"></script>
<script src="/assets/bonus.js?v=2"></script>
<script src="/assets/src.js?v=1"></script>
<script src="/assets/account.js"></script>
<script src="/assets/catalog.js?v=10"></script>
<script src="/assets/chat.js?v=4" defer></script>
<script>
(function(){
'use strict';
function $(id){return document.getElementById(id)}
function track(n,p){try{window.va&&window.va('event',Object.assign({name:n},p||{}))}catch(e){}}
window.track=track;
var esc=TP.esc, app=$('app');
var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

function bonusesHTML(have){
  return '<div class="bl">'+COURSES.map(function(c){
    var bn=BONUS[c.id], got=!!have[c.id];
    return '<div class="bi'+(got?' got':'')+'"><div class="bgem">'+gemHTML({size:'sm',hue:(gemById(c.id)||{hue:0}).hue,locked:!got})+'</div><div><small>'+esc(c.title)+'</small><b>'+esc(bn.title)+'</b><span>'+esc(bn.sub)+'</span>'+crystalTag(c.id,got?'кристалл «'+CRYSTAL[c.id][0]+'» получен':null)+'</div>'+
      (got?'<a class="btn gho sm" href="'+have[c.id]+'">Открыть</a>':'<em>'+(c.status==='open'?'Вместе с курсом':'После старта курса')+'</em>')+'</div>';
  }).join('')+'</div>';
}
function guest(){
  app.innerHTML='<div class="top"><div class="eyebrow">Профиль</div><h1>Твои инструкции <span class="acc">и материалы</span></h1>'+
    '<p class="lead">Войди по почте: здесь хранятся купленные инструкции и бонусы к курсам. Код придёт в письме, пароль не нужен.</p></div>'+
    '<div class="logincard" id="lf"></div><section class="sec"><div class="eyebrow">Бонусы</div><h2>Что заберёшь с курсами</h2>'+bonusesHTML({})+'</section>';
  TP.loginForm($('lf'),{cta:'Войти',onDone:function(){app.innerHTML='<p class="loading">Загружаем профиль…</p>';load()}});
}

// Если на этом устройстве уже есть оплаченная инструкция — сразу привязываем её к профилю.
function claimLocal(){
  var o=null; try{o=localStorage.getItem('claude_start_order_v1')}catch(e){}
  if(!o||!UUID.test(o)) return Promise.resolve();
  return TP.claim(o).then(function(){},function(){});
}

function render(d){
  var guides=d.guides||[], have={};
  if(guides.length) have.start='/start?order='+encodeURIComponent(guides[0].id)+'#bonus';
  var waits=(d.waitlist||[]).map(function(id){var c=courseById(id);return c?'<a class="chip" href="/#c-'+id+'">'+esc(c.title)+'</a>':''}).join('');
  app.innerHTML='<div class="top"><div class="eyebrow">Профиль</div><h1>Мои <span class="acc">материалы</span></h1>'+
    '<div class="who"><span class="chip">'+esc(d.user.email)+'</span><button class="linkbtn" id="out" type="button">Выйти</button></div></div>'+
    (d.admin?'<section class="sec" id="funnel" style="padding-top:36px"><div class="eyebrow">Админ</div><h2>Воронка по меткам</h2><p class="loading" style="padding:0">Загружаем…</p></section>':'')+
    (d.admin?'<section class="sec" id="admin" style="padding-top:36px"><div class="eyebrow">Админ</div><h2>Рассылки</h2><p class="loading" style="padding:0">Загружаем…</p></section>':'')+
    '<section class="sec" style="padding-top:36px"><div class="eyebrow">Инструкции</div><h2>Мои инструкции</h2>'+
      (guides.length?guides.map(function(g){
        var dt=g.paid_at?new Date(g.paid_at).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}):'';
        var u='/start?order='+encodeURIComponent(g.id);
        return '<div class="card"><h3>'+esc((courseById(g.course)||courseById('start')||{}).title||'Инструкция')+'</h3><p>'+esc(dt)+(g.sphere?' · '+esc(g.sphere):'')+'</p><p class="cbtns"><a class="btn pri sm" href="'+u+'">Открыть инструкцию</a><a class="btn gho sm" href="'+u+'#bonus">50 запросов</a></p></div>'}).join(''):
        '<p class="empty">Пока нет ни одной. Пройди <a href="/start">«Как начать с ИИ»</a> — инструкция и бонус появятся здесь.</p>')+'</section>'+
    '<section class="sec"><div class="eyebrow">Бонусы</div><h2>Бонусы к курсам</h2>'+bonusesHTML(have)+'</section>'+
    '<section class="sec"><div class="eyebrow">Предзапись</div><h2>Жду курсы</h2>'+
      (waits?'<div class="waits">'+waits+'</div><p class="empty" style="margin-top:12px">Напишем на почту, когда откроется запись.</p>':'<p class="empty">Пока ни на что не подписан. <a href="/#courses">Посмотреть курсы</a></p>')+'</section>';
  if(window.mountGems) mountGems(app);
  $('out').onclick=function(){TP.logout();track('auth_logout');guest()};
  if(d.admin){ loadAdmin(); loadFunnel(30) }
}

/* ---------- панель админа: воронка по меткам ?from= ---------- */
function loadFunnel(days){
  var box=$('funnel'); if(!box) return;
  TP.call('GET','/api/admin?funnel=1&days='+days).then(function(d){
    if(!d.funnel){ box.innerHTML='<div class="eyebrow">Админ</div><h2>Воронка по меткам</h2><p class="empty">Не получилось загрузить ('+esc(d.error||d._status)+'). Если только что обновили сайт — выполни SQL с таблицей visits в Supabase.</p>'; return }
    renderFunnel(d.funnel);
  });
}
function renderFunnel(f){
  var box=$('funnel');
  function pct(a,b){ return b?' <i>'+Math.round(a*100/b)+'%</i>':'' }
  function tr(r,head){
    return '<tr'+(head?' class="tot"':'')+'><td>'+(head?'Всего':(r.src?esc(r.src):'<span class="nos">без метки</span>'))+'</td><td>'+r.visitors+'</td><td>'+r.started+'</td><td>'+r.answered+pct(r.answered,r.started)+'</td><td>'+r.paid+pct(r.paid,r.answered)+(r.free?' <i>+'+r.free+' беспл.</i>':'')+'</td><td>'+r.revenue.toLocaleString('ru-RU')+' ₽</td><td>'+(r.kit||'—')+'</td></tr>';
  }
  var P=[[7,'7 дней'],[30,'30 дней'],[90,'90 дней'],[0,'всё время']];
  box.innerHTML='<div class="eyebrow">Админ</div><h2>Воронка по меткам</h2>'+
    '<p class="empty">Ссылка с меткой: <code>tap-page.ru/start?from=start_r23</code> — латиница, цифры, _ и -. Метка живёт в браузере 30 дней.</p>'+
    '<div class="fper">'+P.map(function(p){return '<button class="btn sm '+(p[0]===f.days?'pri':'gho')+'" data-d="'+p[0]+'">'+p[1]+'</button>'}).join('')+'</div>'+
    '<div class="ftab"><table><thead><tr><th>Метка</th><th>Заходы</th><th>Начали</th><th>Ответили</th><th>Оплатили 299</th><th>Выручка</th><th>Набор</th></tr></thead><tbody>'+
    (f.rows.length?f.rows.map(function(r){return tr(r)}).join('')+tr(f.total,true):'<tr><td colspan="7">Пока пусто</td></tr>')+'</tbody></table></div>'+
    '<p class="empty" style="margin-top:8px">Заходы — уникальные браузеры. Заказы и оплаты до появления меток попадают в «без метки».</p>';
  [].forEach.call(box.querySelectorAll('[data-d]'),function(b){ b.onclick=function(){ loadFunnel(Number(b.getAttribute('data-d'))) } });
}

/* ---------- панель админа: рассылка по листу ожидания ---------- */
function loadAdmin(){
  TP.call('GET','/api/admin').then(function(d){ if(d.courses) renderAdmin(d); else $('admin').querySelector('.loading').textContent='Не получилось загрузить панель ('+(d.error||d._status)+').' });
}
function renderAdmin(d){
  var box=$('admin');
  var h='<div class="eyebrow">Админ</div><h2>Рассылки</h2><p class="empty">Письмо «курс открылся» уходит всем из листа ожидания курса, кто ещё не получал его. Каждому — один раз, в письме есть ссылка «Отписаться».</p>'+
    (d.mail?'':'<div class="warn">Отправка писем не настроена: добавь RESEND_API_KEY в Vercel и сделай Redeploy.</div>');
  d.courses.forEach(function(c){
    var sent=c.total-c.pending;
    h+='<form class="adm" data-c="'+c.id+'"><div class="adm-h"><b>'+esc(c.title)+'</b><span>в листе: '+c.total+' · ждут письма: '+c.pending+' · получили: '+sent+'</span></div>'+
      (c.total?'<details><summary>Адреса ('+c.total+')</summary><ul>'+c.emails.map(function(e){return '<li>'+esc(e.email)+(e.notified?' ✓':'')+'</li>'}).join('')+'</ul></details>':'')+
      '<label>Тема письма</label><input name="subject" maxlength="150" value="'+esc('Курс «'+c.title+'» открылся')+'">'+
      '<label>Текст</label><textarea name="text" maxlength="4000">'+esc('Привет!\n\nТы просил сообщить о старте — курс «'+c.title+'» уже открыт.\n\nВнутри пошаговая инструкция под твою задачу. Начать можно прямо сейчас.\n\nМакс')+'</textarea>'+
      '<div class="row2"><div><label>Текст кнопки</label><input name="cta" maxlength="40" value="Открыть курс"></div><div><label>Ссылка кнопки</label><input name="link" maxlength="300" value="https://tap-page.ru/#c-'+c.id+'"></div></div>'+
      '<div class="btns"><button class="btn gho" type="button" data-a="test">Тест себе</button><button class="btn pri" type="button" data-a="send"'+(c.pending&&d.mail?'':' disabled')+'>Разослать ('+c.pending+')</button><span class="st"></span></div></form>';
  });
  var NAMES={nabor:'Набор',montage:'Монтаж',assistant:'Помощник',group:'Группа'};
  h+='<div class="adm"><div class="adm-h"><b>История</b></div>'+(d.history&&d.history.length?'<ul class="hist">'+d.history.map(function(x){
    return '<li><span>'+new Date(x.created_at).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'</span><b>'+esc(NAMES[x.course]||x.course)+'</b><span>'+esc(x.subject)+'</span><span>'+(x.test?'тест':'отправлено '+x.sent)+(x.failed?' · ошибок '+x.failed:'')+'</span></li>'}).join('')+'</ul>':'<p class="empty" style="margin-top:8px">Рассылок ещё не было.</p>')+'</div>';
  box.innerHTML=h;
  [].forEach.call(box.querySelectorAll('form.adm'),function(f){
    var st=f.querySelector('.st');
    f.onsubmit=function(e){e.preventDefault()};
    [].forEach.call(f.querySelectorAll('[data-a]'),function(b){ b.onclick=function(){
      var test=b.getAttribute('data-a')==='test', c=f.getAttribute('data-c');
      var data={action:'send',course:c,test:test,subject:f.subject.value,text:f.text.value,cta:f.cta.value,link:f.link.value};
      if(!test){ var n=(b.textContent.match(/\d+/)||['0'])[0]; if(!confirm('Разослать письмо '+n+' адресам? Отменить будет нельзя.')) return }
      st.className='st'; st.textContent=test?'Отправляем тест…':'Рассылаем…'; b.disabled=true;
      TP.call('POST','/api/admin',data).then(function(r){
        b.disabled=false;
        if(r.ok&&test){ st.className='st ok'; st.textContent='Тест отправлен на '+r.to; return }
        if(r.ok){ st.className='st ok'; st.textContent='Отправлено: '+r.sent+(r.failed?', ошибок: '+r.failed:''); track('admin_announce',{course:c,sent:r.sent}); setTimeout(loadAdmin,1500); return }
        st.className='st bad'; st.textContent={none:'Некому отправлять: все из листа уже получили письмо',empty:'Заполни тему и текст',link:'Ссылка должна начинаться с https://',mail:'Не настроена отправка писем (RESEND_API_KEY)'}[r.error]||('Ошибка: '+(r.error||r._status));
      },function(){b.disabled=false;st.className='st bad';st.textContent='Нет связи'});
    }});
  });
}

function load(){
  if(!TP.user()) return guest();
  claimLocal().then(function(){ return TP.call('GET','/api/account') }).then(function(d){
    if(d._status===401){TP.logout();return guest()}
    if(!d.user){app.innerHTML='<p class="loading">Не получилось загрузить профиль. Обнови страницу.</p>';return}
    render(d);
  },function(){app.innerHTML='<p class="loading">Нет связи. Обнови страницу.</p>'});
}
load();
})();
</script>
</body>
</html>
