<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
.top{padding-block:44px 0}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.logincard{margin-top:24px;border-radius:24px;padding:24px;background:var(--s1);border:1px solid var(--line2)}
.empty{color:var(--tx2);margin:0}
.waits{display:flex;gap:8px;flex-wrap:wrap}
.loading{color:var(--tx3);padding:40px 0}
</style>
</head>
<body>
<nav class="nav"><div class="wrap wide">
  <a class="logo" href="/"><i>M</i>makswo</a>
  <span class="sp"></span>
  <a class="mono" href="/#courses" style="text-decoration:none">Курсы</a>
</div></nav>

<main class="wrap wide" id="app"><p class="loading">Загружаем профиль…</p></main>

<footer>Сделал Макс · <a href="https://www.instagram.com/makswo/" target="_blank" rel="noopener">@makswo</a> · <a href="/oferta" target="_blank" rel="noopener">Публичная оферта</a> · Это не официальный материал Anthropic<br><span class="freq">ИП Малыгин Максим Валерьевич · ИНН 183512338627 · ОГРНИП 323180000018526 · <a href="mailto:mxmgin@gmail.com">mxmgin@gmail.com</a></span></footer>

<script src="/assets/gem.js"></script>
<script src="/assets/account.js"></script>
<script src="/assets/catalog.js"></script>
<script src="/assets/support.js" defer></script>
<script>
(function(){
'use strict';
function $(id){return document.getElementById(id)}
function track(n,p){try{window.va&&window.va('event',Object.assign({name:n},p||{}))}catch(e){}}
window.track=track;
var esc=TP.esc, app=$('app');
var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

function guest(){
  app.innerHTML='<div class="top"><div class="eyebrow">Профиль</div><h1>Твои кристаллы <span class="acc">и инструкции</span></h1>'+
    '<p class="lead">Войди по почте: здесь хранятся купленные инструкции и сертификаты на кристаллы. Код придёт в письме, пароль не нужен.</p></div>'+
    '<div class="logincard" id="lf"></div><section class="sec"><div class="eyebrow">Коллекция</div><h2>Собери все 7 кристаллов</h2><div id="coll"></div></section>';
  TP.loginForm($('lf'),{cta:'Войти',onDone:function(){app.innerHTML='<p class="loading">Загружаем профиль…</p>';load()}});
  $('coll').innerHTML=collectionHTML({}); mountGems($('coll'));
}

// Если на этом устройстве уже есть оплаченная инструкция — сразу привязываем её к профилю.
function claimLocal(){
  var o=null; try{o=localStorage.getItem('claude_start_order_v1')}catch(e){}
  if(!o||!UUID.test(o)) return Promise.resolve();
  return TP.claim(o).then(function(){},function(){});
}

function render(d){
  var owned={}; (d.certificates||[]).forEach(function(c){owned[c.course]=true});
  var certs=(d.certificates||[]).map(certHTML).join('');
  var linked={}; (d.certificates||[]).forEach(function(c){if(c.order_id)linked[c.order_id]=1});
  var extra=(d.guides||[]).filter(function(g){return !linked[g.id]});
  var waits=(d.waitlist||[]).map(function(id){var c=courseById(id);return c?'<a class="chip" href="/#c-'+id+'">'+esc(c.title)+'</a>':''}).join('');
  app.innerHTML='<div class="top"><div class="eyebrow">Профиль</div><h1>Твоя <span class="acc">коллекция</span></h1>'+
    '<div class="who"><span class="chip">'+esc(d.user.email)+'</span><button class="linkbtn" id="out" type="button">Выйти</button></div></div>'+
    '<section class="sec" style="padding-top:36px"><div id="coll"></div></section>'+
    '<section class="sec"><div class="eyebrow">Сертификаты</div><h2>Твои кристаллы</h2>'+
      (certs||'<p class="empty">Пока нет ни одного. Пройди <a href="/start">«Как начать с Claude»</a> — первый кристалл придёт вместе с инструкцией.</p>')+'</section>'+
    (extra.length?'<section class="sec"><div class="eyebrow">Инструкции</div><h2>Ещё инструкции</h2>'+extra.map(function(g){
      var dt=g.paid_at?new Date(g.paid_at).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}):'';
      return '<div class="card"><h3>Как начать с Claude</h3><p>'+esc(dt)+(g.sphere?' · '+esc(g.sphere):'')+'</p><p><a class="btn gho sm" href="/start?order='+encodeURIComponent(g.id)+'">Открыть</a></p></div>'}).join('')+'</section>':'')+
    '<section class="sec"><div class="eyebrow">Скоро</div><h2>Жду курсы</h2>'+
      (waits?'<div class="waits">'+waits+'</div><p class="empty" style="margin-top:12px">Напишем на почту, когда откроются.</p>':'<p class="empty">Пока ни на что не подписан. <a href="/#courses">Посмотреть курсы</a></p>')+'</section>';
  $('coll').innerHTML=collectionHTML(owned);
  mountGems(app);
  $('out').onclick=function(){TP.logout();track('auth_logout');guest()};
}

function load(){
  if(!TP.user()) return guest();
  claimLocal().then(function(){ return TP.call('GET','/api/account') }).then(function(d){
    if(d._status===401){TP.logout();return guest()}
    if(!d.user){app.innerHTML='<p class="loading">Не получилось загрузить профиль. Обнови страницу.</p>';return}
    render(d);
  },function(){app.innerHTML='<p class="loading">Нет связи. Обнови страницу.</p>'});
}
load();
})();
</script>
</body>
</html>
